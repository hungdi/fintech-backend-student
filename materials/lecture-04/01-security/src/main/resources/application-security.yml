# 로컬 실습용 제공자 설정입니다. 기본 실습은 /api/auth/login의 LOCAL 로그인입니다.
# 아래 외부 제공자 주소는 예시이며 실제 로그인 연동에는 사용할 수 없습니다.
spring:
  security:
    oauth2:
      client:
        registration:
          training:
            client-id: training-client
            client-secret: training-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            provider: training
        provider:
          training:
            authorization-uri: https://auth.example.local/oauth2/authorize
            token-uri: https://auth.example.local/oauth2/token
            jwk-set-uri: https://auth.example.local/oauth2/jwks
            user-info-uri: https://auth.example.local/oauth2/userinfo
            user-name-attribute: sub

app:
  security:
    issuer: sparta-fintech
    access-token-ttl-minutes: 30
    jwt-secret: ${JWT_SECRET}
    crypto-password: ${APP_CRYPTO_PASSWORD}
    crypto-salt: ${APP_CRYPTO_SALT}
