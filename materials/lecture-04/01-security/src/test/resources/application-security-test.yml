# test와 security-test 프로필을 함께 사용합니다. 이 값은 공개된 테스트 전용 값입니다.
spring:
  security:
    oauth2:
      client:
        registration:
          training:
            client-id: training-client
            client-secret: training-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            provider: training
        provider:
          training:
            authorization-uri: https://auth.example.local/oauth2/authorize
            token-uri: https://auth.example.local/oauth2/token
            jwk-set-uri: https://auth.example.local/oauth2/jwks
            user-info-uri: https://auth.example.local/oauth2/userinfo
            user-name-attribute: sub

app:
  security:
    issuer: sparta-fintech-test
    access-token-ttl-minutes: 30
    jwt-secret: sparta-financial-security-test-secret-key-32bytes
    crypto-password: sparta-test-crypto-password
    crypto-salt: 5c0744940b5c369b
