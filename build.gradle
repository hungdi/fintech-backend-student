plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.sparta.fintech'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    // UTC 동작이 서버 기본 시간대에 의존하지 않는지 검증한다.
    systemProperty 'user.timezone', 'Pacific/Honolulu'
}


// 제공한 준비 코드만 확인합니다. 기본 test는 모든 과제 테스트도 실행합니다.
tasks.register('smokeTest', Test) {
    description = 'DB 없이 준비 코드의 계약을 확인합니다. 업무 기능 완료 검사는 test를 사용합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'smoke' }
    systemProperty 'user.timezone', 'Pacific/Honolulu'
}
